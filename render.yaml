# Render Blueprint for the Taza AI API (Express, run with tsx — no separate build).
# Free plan: the service sleeps after 15 min without requests; the first request
# after that takes up to ~1 minute. The disk is ephemeral, so photos go to
# Supabase Storage (S3_*). Secrets (sync: false) are entered in the Render dashboard.
services:
  - type: web
    name: taza-ai-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # mongodb-memory-server is only for local dev: don't download mongod on Render
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"

      # --- Database: MongoDB Atlas (free M0) ---
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: tazaai

      # --- AI and satellite keys ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: FIRMS_MAP_KEY
        sync: false

      # --- Frontend address (the Vercel URL, no trailing slash) ---
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: CLIENT_ID_SALT
        generateValue: true

      # --- Photos: Supabase Storage (S3-compatible). Without these, photos are lost on every restart ---
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: photos
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false

      # 1 = add the 12 demo reports on start if there are none
      - key: SEED_DEMO
        value: "1"
