services:
  - type: web
    name: clean-city-api
    runtime: node
    plan: free
    # The backend lives in /server; repo root is the build context.
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT # Render injects this automatically
        sync: false
      - key: MONGODB_URI # set in Render dashboard (secret)
        sync: false
      - key: MONGODB_DB # set in Render dashboard
        sync: false
      - key: CORS_ORIGINS # set to your Vercel URL, e.g. https://clean-city-report.vercel.app
        sync: false
      # --- Optional object storage (free + permanent image hosting) ---
      # Set ALL of these to store uploads in Cloudflare R2 / Supabase Storage
      # (both S3-compatible). Without them, uploads use local disk (ephemeral
      # on Render free tier — deleted on every redeploy).
      - key: S3_ENDPOINT # e.g. https://<accountid>.r2.cloudflarestorage.com
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL # e.g. https://pub-<hash>.r2.dev  (R2 public bucket URL)
        sync: false
